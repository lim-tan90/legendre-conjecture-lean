name: verify

on:
  pull_request:
    branches: [review, master]
  push:
    branches: [review, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the pinned official binary directly, as validated locally. Keep
      # installation, cache retrieval, build and audit separately observable.
      - name: Install pinned Lean
        shell: bash
        run: bash scripts/install-lean-ci.sh

      - name: Get pinned mathlib cache
        run: lake exe cache get

      - name: Build all proofs
        run: lake build

      - name: Standalone Layer 3 consumer checks
        run: lake env lean Legendre/Tests/Layer3.lean

      - name: Standalone Layer 4 consumer checks
        run: lake env lean Legendre/Tests/Layer4.lean

      - name: Axiom and explosion audit
        run: python3 scripts/audit.py --skip-build
